<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Emberwild: Dragon Rush</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='28' fill='%23f6c445' stroke='%23a8640a' stroke-width='5'/%3E%3Cpath d='M32 14c8 10 8 22 0 34-8-12-8-24 0-34z' fill='%23e19a17'/%3E%3C/svg%3E" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Optional web font; the game falls back to system fonts when offline. -->
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet" />
    
    <style>
/* Emberwild visual system: teal surfaces, cream panels, restrained gold accents. */
:root {
  --teal-900: #0b3c43;
  --teal-800: #0f4f58;
  --teal-700: #136670;
  --teal-600: #198391;
  --teal-400: #3cb7bf;
  --teal-100: #d7f3f1;
  --gold-500: #f6c445;
  --gold-600: #e3a62a;
  --gold-700: #a8640a;
  --gold-100: #fff3cf;
  --cream: #fff8ec;
  --line: #efe2cb;
  --ink: #2b2320;
  --ink-soft: #6b5a50;
  --magenta: #d81b74;
  --ok: #2a8a63;
  --hud: rgba(11, 60, 67, 0.84);
  --radius: 18px;
  --font: 'Baloo 2', 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
}

* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  height: 100%;
  overflow: hidden;
  background: #241a2e;
  font-family: var(--font);
  color: var(--ink);
  user-select: none;
  -webkit-user-select: none;
}

#viewport {
  position: fixed;
  inset: 0;
  overflow: hidden;
  background: radial-gradient(ellipse at 50% 40%, #3a2c4a 0%, #1b1424 100%);
}

#stage {
  position: absolute;
  left: 0;
  top: 0;
  width: 1280px;
  height: 720px;
  transform-origin: 0 0;
  overflow: hidden;
  border-radius: 6px;
  box-shadow: 0 10px 60px rgba(0, 0, 0, 0.45);
  background: #f8c99c;
}

#flight-canvas {
  position: absolute;
  left: 0;
  top: 0;
  width: 1280px;
  height: 720px;
  display: none;
  cursor: crosshair;
  touch-action: none;
}

#flight-canvas.active {
  display: block;
}

#screen-root {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

#screen-root > * {
  pointer-events: auto;
}

/* The flight HUD must let clicks through to the canvas (only its buttons are interactive). */
#screen-root > .hud {
  pointer-events: none;
}

.screen-enter {
  animation: screen-in 0.18s ease-out;
}

@keyframes screen-in {
  from {
    opacity: 0;
    transform: translateY(6px);
  }
}

button {
  font-family: inherit;
  cursor: pointer;
  border: none;
  color: inherit;
  background: none;
}

button:disabled {
  cursor: not-allowed;
}

:focus-visible {
  outline: 3px solid var(--gold-500);
  outline-offset: 3px;
}

.icon {
  width: 26px;
  height: 26px;
  vertical-align: middle;
  flex: none;
}

.icon.sm {
  width: 20px;
  height: 20px;
}

.sr {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
}

.muted {
  color: var(--ink-soft);
}

.hidden {
  visibility: hidden;
}

/* ---------- buttons ---------- */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 42px;
  padding: 6px 18px;
  border-radius: 14px;
  font-weight: 700;
  font-size: 18px;
  line-height: 1.1;
  white-space: nowrap;
  background: var(--teal-600);
  color: #fff;
  box-shadow: 0 4px 0 var(--teal-800);
  transition: transform 0.08s, filter 0.15s, box-shadow 0.08s;
}

.btn:hover:not(:disabled) {
  filter: brightness(1.08);
}

.btn:active:not(:disabled) {
  transform: translateY(3px);
  box-shadow: 0 1px 0 var(--teal-800);
}

.btn:disabled {
  background: #cbc3b8;
  box-shadow: 0 4px 0 #a39a90;
  color: #f7f3ee;
}

.btn.gold {
  background: linear-gradient(#ffd866, var(--gold-600));
  color: #4a2a05;
  box-shadow: 0 4px 0 var(--gold-700);
}

.btn.gold:disabled {
  background: #e6dccd;
  color: #9d8f80;
  box-shadow: 0 4px 0 #c4b8a7;
}

.btn.ghost {
  background: #fff;
  color: var(--teal-800);
  box-shadow: 0 4px 0 rgba(15, 79, 88, 0.3);
}

.btn.big {
  min-height: 56px;
  font-size: 24px;
  padding: 10px 30px;
  border-radius: 16px;
}

.btn.small {
  min-height: 34px;
  font-size: 15px;
  padding: 4px 14px;
}

.toggle {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  min-height: 36px;
  padding: 4px 12px;
  border-radius: 12px;
  font-weight: 700;
  font-size: 14px;
  background: rgba(255, 255, 255, 0.78);
  color: var(--teal-800);
  box-shadow: 0 3px 0 rgba(15, 79, 88, 0.25);
}

.toggle[aria-pressed='true'] {
  background: var(--teal-700);
  color: #fff;
}

.toggle:disabled {
  opacity: 0.6;
}

/* ---------- surfaces ---------- */

.panel {
  background: var(--cream);
  border-radius: var(--radius);
  box-shadow: 0 5px 0 rgba(15, 79, 88, 0.16), 0 10px 26px rgba(60, 30, 20, 0.14);
  border: 2px solid rgba(25, 131, 145, 0.16);
}

.pill {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 3px 14px 3px 8px;
  border-radius: 999px;
  background: var(--hud);
  color: #fff;
  font-weight: 800;
  font-size: 21px;
}

.badge {
  display: inline-flex;
  align-items: center;
  padding: 1px 9px;
  border-radius: 999px;
  background: var(--teal-100);
  color: var(--teal-800);
  font-weight: 800;
  font-size: 13px;
  line-height: 1.6;
}

.badge.sel {
  background: var(--gold-100);
  color: var(--gold-700);
  box-shadow: inset 0 0 0 2px var(--gold-500);
}

.badge.ready {
  background: #dff5e9;
  color: var(--ok);
  box-shadow: inset 0 0 0 2px #7fd0a6;
}

.badge.lock {
  background: #ece4d7;
  color: #7d6e60;
}

.progress {
  position: relative;
  height: 14px;
  border-radius: 999px;
  background: #e9dcc7;
  overflow: hidden;
  box-shadow: inset 0 2px 3px rgba(0, 0, 0, 0.12);
}

.progress.thin {
  height: 8px;
}

.progress > i {
  position: absolute;
  inset: 0 auto 0 0;
  border-radius: 999px;
  background: linear-gradient(90deg, var(--gold-600), var(--gold-500));
  transition: width 0.4s;
}

.progress.fruit > i {
  background: linear-gradient(90deg, #c4186c, #ff6fb3);
}

.progress.teal > i {
  background: linear-gradient(90deg, var(--teal-600), var(--teal-400));
}

.progress.done > i {
  background: linear-gradient(90deg, #2aa37c, #6bd6a2);
}

.row {
  display: flex;
  gap: 10px;
  align-items: center;
}

.row.spread {
  justify-content: space-between;
}

#toast-root {
  position: absolute;
  left: 50%;
  top: 76px;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column;
  gap: 8px;
  align-items: center;
  pointer-events: none;
  z-index: 50;
}

.toast {
  background: rgba(11, 60, 67, 0.95);
  color: #fff;
  padding: 9px 20px;
  border-radius: 14px;
  font-size: 17px;
  font-weight: 600;
  max-width: 660px;
  text-align: center;
  box-shadow: 0 6px 24px rgba(0, 0, 0, 0.25);
  animation: toast-in 0.25s ease-out;
}

.toast.out {
  opacity: 0;
  transition: opacity 0.4s;
}

@keyframes toast-in {
  from {
    transform: translateY(-10px);
    opacity: 0;
  }
}

/* ---------- flight HUD ---------- */

.hud {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.hud button {
  pointer-events: auto;
}

.hud-top {
  position: absolute;
  left: 16px;
  right: 16px;
  top: 12px;
  display: flex;
  align-items: flex-start;
  gap: 12px;
}

.timer {
  --p: 1;
  position: relative;
  width: 70px;
  height: 70px;
  border-radius: 50%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: #fff;
  line-height: 0.9;
  background: conic-gradient(var(--teal-400) calc(var(--p) * 360deg), rgba(255, 255, 255, 0.22) 0);
}

.timer::before {
  content: '';
  position: absolute;
  inset: 6px;
  border-radius: 50%;
  background: var(--hud);
}

.timer > * {
  position: relative;
}

.timer b {
  font-size: 27px;
}

.timer small {
  font-size: 12px;
  font-weight: 700;
  color: #cfeeea;
}

.timer.low {
  background: conic-gradient(#ff8a5c calc(var(--p) * 360deg), rgba(255, 255, 255, 0.22) 0);
}

.haul {
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  background: var(--hud);
  border-radius: 18px;
  padding: 2px 18px 4px;
  color: #fff;
}

.haul-label {
  font-size: 12px;
  font-weight: 800;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: #bfe9e4;
}

.haul-items {
  display: flex;
  align-items: center;
  gap: 7px;
  font-weight: 800;
  font-size: 26px;
  line-height: 1.15;
}

.haul-items b {
  min-width: 38px;
  display: inline-block;
}

.bump {
  animation: bump 0.2s ease-out;
}

@keyframes bump {
  50% {
    transform: scale(1.25);
  }
}

.pause-btn {
  width: 54px;
  height: 54px;
  border-radius: 16px;
  background: var(--hud);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

.pause-btn i {
  width: 6px;
  height: 20px;
  background: #fff;
  border-radius: 2px;
}

.hud-bottom {
  position: absolute;
  left: 16px;
  right: 16px;
  bottom: 12px;
  display: flex;
  align-items: flex-end;
  gap: 16px;
}

.dash-ind {
  --p: 1;
  position: relative;
  width: 96px;
  height: 96px;
  border-radius: 50%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  color: #6f9a9a;
  background: conic-gradient(#8fd8d2 calc(var(--p) * 360deg), rgba(255, 255, 255, 0.2) 0);
}

.dash-ind::before {
  content: '';
  position: absolute;
  inset: 7px;
  border-radius: 50%;
  background: var(--hud);
}

.dash-ind > * {
  position: relative;
}

.dash-ind svg {
  width: 44px;
  height: 28px;
}

.dash-ind span {
  font-size: 13px;
  font-weight: 800;
  letter-spacing: 1px;
}

.dash-ind.ready {
  color: var(--gold-500);
  background: conic-gradient(var(--gold-500) 360deg, transparent 0);
  box-shadow: 0 0 0 4px rgba(255, 226, 122, 0.55), 0 0 22px rgba(255, 210, 90, 0.8);
  animation: ready-pulse 1.1s ease-in-out infinite;
}

.dash-ind.denied {
  animation: shake 0.25s;
}

@keyframes ready-pulse {
  50% {
    box-shadow: 0 0 0 7px rgba(255, 226, 122, 0.3), 0 0 30px rgba(255, 210, 90, 0.9);
  }
}

@keyframes shake {
  25% {
    transform: translateX(-5px);
  }
  75% {
    transform: translateX(5px);
  }
}

.rush {
  flex: 0 0 420px;
  margin: 0 auto 6px;
  background: var(--hud);
  border-radius: 18px;
  padding: 5px 14px 9px;
  color: #fff;
}

.rush-label {
  display: flex;
  justify-content: space-between;
  font-weight: 800;
  font-size: 16px;
  letter-spacing: 0.5px;
}

.rush .bar {
  position: relative;
  height: 16px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.2);
  overflow: hidden;
  margin-top: 3px;
}

.rush .bar::after {
  /* segment ticks make progress readable at a glance */
  content: '';
  position: absolute;
  inset: 0;
  background: repeating-linear-gradient(90deg, transparent 0 calc(10% - 2px), rgba(11, 60, 67, 0.55) calc(10% - 2px) 10%);
}

.rush .bar i {
  display: block;
  height: 100%;
  width: 0;
  background: linear-gradient(90deg, #ff9a3c, var(--gold-500));
}

.rush.active {
  background: linear-gradient(90deg, rgba(200, 90, 20, 0.94), rgba(220, 150, 30, 0.94));
  box-shadow: 0 0 24px rgba(255, 200, 80, 0.8);
}

.rush.active .bar i {
  background: linear-gradient(90deg, #fff2b0, #ffd84a);
}

.rush-spacer {
  width: 96px;
}

.hint {
  position: absolute;
  left: 50%;
  top: 92px;
  transform: translateX(-50%);
  background: rgba(255, 248, 236, 0.96);
  color: var(--teal-800);
  font-weight: 800;
  font-size: 21px;
  padding: 5px 18px;
  border-radius: 14px;
  box-shadow: 0 4px 0 rgba(15, 79, 88, 0.25);
  opacity: 0;
  transition: opacity 0.25s;
  white-space: nowrap;
}

.hint.show {
  opacity: 1;
}

.tutorial {
  position: absolute;
  left: 50%;
  bottom: 92px;
  transform: translateX(-50%);
  background: var(--hud);
  color: #fff;
  font-weight: 700;
  font-size: 21px;
  padding: 6px 20px;
  border-radius: 999px;
  transition: opacity 0.6s;
  white-space: nowrap;
}

.tutorial b {
  color: var(--gold-500);
}

.tutorial span {
  font-size: 15px;
  color: #cfeeea;
}

.tutorial.hide {
  opacity: 0;
}

/* ---------- overlays ---------- */

.overlay {
  position: absolute;
  inset: 0;
  background: rgba(20, 16, 30, 0.55);
  display: flex;
  align-items: center;
  justify-content: center;
  pointer-events: auto;
  z-index: 20;
}

.overlay .panel {
  width: 470px;
  padding: 22px 28px 24px;
  text-align: center;
}

.overlay h2 {
  margin: 0 0 4px;
  font-size: 36px;
  color: var(--teal-800);
}

.overlay p {
  margin: 4px 0 16px;
  font-size: 17px;
}

.overlay .stack {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

/* --- development gallery (?gallery) --- */
html:has(body.gallery-page), body.gallery-page { overflow: auto; height: auto; background: #dfeaee; }
.gallery { font-family: system-ui, sans-serif; color: #1f2a3a; padding: 12px 18px 60px; }
.gallery header { position: sticky; top: 0; z-index: 2; display: flex; gap: 18px; align-items: center; flex-wrap: wrap; background: #dfeaee; padding: 8px 0; }
.gallery h1 { font-size: 20px; margin: 0 12px 0 0; }
.gallery .hint { color: #4a5a6a; font-size: 13px; }
.g-row { display: flex; align-items: center; gap: 12px; margin: 6px 0; }
.g-label { width: 170px; display: flex; flex-direction: column; font-size: 12px; gap: 2px; }
.g-label b { font-size: 16px; }
/* Age of Wings interface: menu shell, screens, HUD additions, results, hatchery, settings. */

.shell {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  background: radial-gradient(ellipse at 30% 0%, #fff6e2 0%, #f3e2c8 55%, #e9d2b2 100%);
}

.topbar {
  height: 60px;
  flex: none;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 0 16px;
  background: linear-gradient(#0f4f58, #0b3c43);
  color: #fff;
  box-shadow: 0 3px 12px rgba(0, 0, 0, 0.18);
  z-index: 2;
}

.brand {
  display: flex;
  flex-direction: column;
  line-height: 1;
  min-width: 132px;
}
.brand b {
  font-size: 24px;
  color: var(--gold-500);
  letter-spacing: 0.5px;
}
.brand small {
  font-size: 12px;
  color: #bfe9e6;
  letter-spacing: 2px;
  text-transform: uppercase;
}

.tabs {
  display: flex;
  gap: 4px;
  flex: 1;
}
.tabs button {
  position: relative;
  height: 42px;
  padding: 0 18px;
  border-radius: 12px;
  font-size: 18px;
  font-weight: 700;
  color: #d7f3f1;
}
.tabs button:hover {
  background: rgba(255, 255, 255, 0.08);
}
.tabs button.on {
  background: var(--cream);
  color: var(--teal-800);
  box-shadow: 0 3px 0 rgba(0, 0, 0, 0.2);
}
.tabs .dot {
  position: absolute;
  top: 2px;
  right: 2px;
  min-width: 20px;
  height: 20px;
  padding: 0 5px;
  border-radius: 10px;
  background: var(--gold-500);
  color: #4a2a05;
  font-size: 13px;
  line-height: 20px;
}

.wallet {
  display: flex;
  gap: 6px;
}
.wallet .chip {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 10px 3px 6px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.12);
  font-size: 17px;
  overflow: hidden;
}
.wallet .chip.key i {
  position: absolute;
  left: 0;
  bottom: 0;
  height: 3px;
  width: calc(var(--p) * 100%);
  background: #7fe0f0;
}

.gear {
  width: 42px;
  height: 42px;
  border-radius: 12px;
  color: #d7f3f1;
  display: grid;
  place-items: center;
}
.gear:hover {
  background: rgba(255, 255, 255, 0.1);
}

.readonly-banner {
  background: #ffe1a8;
  color: #6a3a00;
  font-weight: 700;
  text-align: center;
  padding: 4px;
  font-size: 15px;
}

.content {
  position: relative;
  flex: 1;
  min-height: 0;
}

.screen {
  position: absolute;
  inset: 0;
  padding: 14px 18px 0;
  display: flex;
  flex-direction: column;
  gap: 12px;
}

.goal-wrap {
  margin-top: auto;
  padding-bottom: 12px;
}

.goal-strip {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 6px 8px 6px 14px;
  border-radius: 14px;
  background: rgba(15, 79, 88, 0.9);
  color: #fff;
  font-size: 16px;
}
.goal-label {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 1.5px;
  color: var(--gold-500);
  font-weight: 800;
}
.goal-text {
  font-weight: 700;
  flex: 1;
}
.goal-bar {
  width: 160px;
}
.goal-num {
  font-size: 14px;
  color: #bfe9e6;
  min-width: 52px;
  text-align: right;
}

h1,
h2,
h3,
h4 {
  margin: 0;
  color: var(--teal-800);
  line-height: 1.15;
}
h2 small {
  font-size: 0.7em;
  color: var(--ink-soft);
}
h4 {
  margin: 12px 0 4px;
  font-size: 17px;
}
p {
  margin: 6px 0;
}
.small {
  font-size: 14px;
}
kbd {
  display: inline-block;
  min-width: 22px;
  padding: 0 5px;
  border-radius: 6px;
  background: #fff;
  border: 1px solid #c9bba4;
  box-shadow: 0 2px 0 #c9bba4;
  font-family: inherit;
  font-size: 0.85em;
  font-weight: 800;
  text-align: center;
  color: var(--teal-800);
  line-height: 1.4;
}
.row.center {
  justify-content: center;
}
.row.wrap {
  flex-wrap: wrap;
}
.chips {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.chip-btn {
  min-height: 32px;
  padding: 2px 12px;
  border-radius: 10px;
  background: #fff;
  color: var(--teal-800);
  font-weight: 700;
  font-size: 15px;
  box-shadow: 0 2px 0 rgba(15, 79, 88, 0.25);
}
.chip-btn.on {
  background: var(--teal-700);
  color: #fff;
}
.seg {
  display: flex;
  gap: 4px;
}

.rarity {
  display: inline-flex;
  gap: 3px;
  align-items: center;
  padding: 0 8px;
  border-radius: 8px;
  font-weight: 800;
  font-size: 13px;
  border: 2px solid currentColor;
  line-height: 1.5;
}
.rarity.r-common {
  color: #5f6f7c;
}
.rarity.r-rare {
  color: #2a74b8;
  border-style: dashed;
}
.rarity.r-epic {
  color: #7a3ab8;

.r-canyon {

}

}

}

  --rc: #7a5ad8;
}

.dc-name {

.hatchery {

}

.ability-ind {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 12px;
  border-radius: 14px;
  background: var(--hud);
  color: #fff;
  min-width: 250px;
  pointer-events: auto;
}

  font-size: 16px;
}
.ab-body {
  flex: 1;

  flex-direction: column;
  gap: 3px;

  font-size: 15px;
}

.boss-bar .bar {
  height: 8px;
  border-radius: 4px;
  background: rgba(255, 255, 255, 0.2);
  overflow: hidden;
}
.ability-ind .bar i,
.boss-bar .bar i {
  display: block;

  background: linear-gradient(90deg, #7fe0f0, #fff);

}

function xpToNext(level) {
  if (level >= MAX_LEVEL) return 0;
  return 40 + 12 * level + (level >= 15 ? 3 : 1) * level * level;
}
function totalXpFor(level) {
  let t = 0;
  for (let l = 1; l < Math.min(level, MAX_LEVEL); l++) t += xpToNext(l);
  return t;
}
function addXp(level, xp, gained) {
  let l = level;
  let x = xp + Math.max(0, Math.floor(gained));
  const levelsGained = [];
  while (l < MAX_LEVEL && x >= xpToNext(l)) {
    x -= xpToNext(l);
    l++;
    levelsGained.push(l);
  }
  if (l >= MAX_LEVEL) x = 0;

      return false;

  onClick(e) {
    const b = e.target.closest("[data-a]");

    const a = b.dataset.a;
    const v = b.dataset.v ?? "";
    const ui = this.ui;
    const id = this.focus;
    sfx.click();
    switch (a) {
      case "focus":
        this.focus = v;
        break;
      case "tab":
        this.tab = v;
        break;
      case "filter":
        this.q.own = v;
        break;
      case "element":
        this.q.element = v;
        break;
      case "rarity":
        this.q.rarity = v;
        break;
      case "clear-filters":
        this.q = { ...DEFAULT_QUERY, sort: this.q.sort };
        this.render();
        this.el.querySelector("[data-fk=search]")?.focus({ preventScroll: true });
        return;
      case "view":
        this.view = v;
        break;
      case "observatory":
        ui.openOverlay(new Observatory(ui, id, v === "egg" ? "egg" : "dragon"));
        return;
      case "codex-egg":
      case "codex-dragon":
        this.focus = v;
        if (a === "codex-dragon") this.view = "dragons";
        break;
      case "qty":
        this.feedQty = Math.max(1, Math.min(feedPlan(ui.save, id, 1).maxPortions || 1, v === "max" ? Infinity : this.feedQty + Number(v)));
        break;
      case "cmp-mode":
        this.compareMode = v;
        break;
      case "select":
        ui.commit(selectDragon(ui.save, id));
        this.hero.cheer();
        ui.toast(`${dragonName(ui.save, id)} is ready to fly.`);
        break;
      case "feed": {
        if (this.feedBusy) return;
        const r = feed(ui.save, id, Number(v) || 1);
        if (!r.ok) {
          sfx.denied();
          ui.toast(r.reason);
          return;
        }
        this.feedBusy = true;
        setTimeout(() => {
          this.feedBusy = false;
          if (this.el.isConnected) this.render();
        }, 450);
        this.feedQty = 1;
        ui.commit(r.save);
        sfx.feed();
        this.hero.feed();
        if (r.change.to > r.change.from) {
          sfx.levelUp();
          this.hero.cheer();
          const ms = r.change.milestones.map((l) => `Level ${l}: ${MILESTONE_LEVELS[l]}`).join(" ");
          ui.toast(`${dragonName(r.save, id)} reached level ${r.change.to}!${r.change.stageTo !== r.change.stageFrom ? ` It evolved into its ${r.change.stageTo} form.` : ""} ${ms}`, 5e3);
        }
        ui.announce(r.extra);
        break;

      case "talent": {
        const [slot, talent] = v.split(":");

        break;
      }
      case "favorite":
        ui.commit(toggleFavorite(ui.save, id));
        break;
      case "marking": {
        const m = v;
        const d = ui.save.dragons[id];
        if (d.ownedMarkings.includes(m)) this.result(setMarking(ui.save, id, m));
        else {
          const def = MARKINGS[m];
          const price = "price" in def ? def.price.essence : 0;
          void ui.confirm(`Unlock ${def.name} markings?`, `Spend ${price} Essence to unlock ${def.name} markings for ${esc(dragonName(ui.save, id))}.`, "Unlock").then((yes) => {
            if (yes) this.result(buyMarking(ui.save, id, m), `${def.name} markings unlocked.`);
            this.render();
          });
          return;
        }
        break;
      }
      case "title":
        this.result(setTitle(ui.save, id, v || null));
        break;
      case "variant":
        this.result(setAbilityVariant(ui.save, id, !ui.save.dragons[id].abilityVariant));
        break;
      case "purchase":
        if (this.result(purchaseSpecies(ui.save, id), `${SPECIES[id].name} hatched and is selected!`)) {
          sfx.hatch(SPECIES[id].element);
          this.hero.cheer();
        }
        break;
      case "essence":
        void ui.confirm(`Unlock ${SPECIES[id].name}?`, `Spend ${HATCHERY.directPrice[SPECIES[id].rarity]} Essence to add ${SPECIES[id].name} to your roster now.`, "Unlock").then((yes) => {

            sfx.hatch(SPECIES[id].element);
            this.hero.cheer();
          }
          this.render();
        });
        return;
      case "hatchery":
        ui.go("hatchery");
        return;

    this.render();
